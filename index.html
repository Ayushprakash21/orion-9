<!doctype html>
<html lang="en" class="dark" style="background-color: var(--os-bg, #07090E); color: #E2E8F0; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/orion-9-favicon.png" />
    <title>ORION-9</title>
    <meta name="description" content="ORION-9: AI Supply Chain Operating System. CONNECT. OBSERVE. PREDICT. ACT." />
    <meta property="og:title" content="ORION-9" />
    <meta property="og:description" content="ORION-9: AI Supply Chain Operating System. CONNECT. OBSERVE. PREDICT. ACT." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Eliminate any white flash before CSS or JS loads */
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--os-bg, #07090E);
        color: #E2E8F0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        background-color: var(--os-bg, #07090E);
      }
      .os-pre-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--os-bg, #07090E);
        color: #E2E8F0;
        z-index: 99999;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .os-pre-bar {
        width: 220px;
        height: 2px;
        background: #171C26;
        border-radius: 9999px;
        position: relative;
        overflow: hidden;
        margin-top: 24px;
      }
      .os-pre-bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(90deg, transparent, #00F2FE, transparent);
        animation: osPreAnim 1.6s infinite ease-in-out;
      }
      @keyframes osPreAnim {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body style="background-color: var(--os-bg, #07090E); color: #E2E8F0; margin: 0; min-height: 100vh;">
    <div id="root">
      <div class="os-pre-loader" id="os-pre-loader">
        <svg width="56" height="56" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" style="filter: drop-shadow(0 0 16px rgba(0,242,254,0.45));">
          <defs>
            <linearGradient id="orion-preload-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00F2FE" />
              <stop offset="100%" stop-color="#0284C7" />
            </linearGradient>
          </defs>
          <circle 
            cx="16" 
            cy="16" 
            r="12" 
            stroke="url(#orion-preload-grad)" 
            stroke-width="3" 
            stroke-dasharray="50 15" 
            stroke-linecap="round" 
            transform="rotate(-45 16 16)" 
          />
          <circle 
            cx="16" 
            cy="16" 
            r="4" 
            fill="url(#orion-preload-grad)" 
            opacity="0.9" 
          />
        </svg>
        <div style="font-weight: 700; font-size: 18px; letter-spacing: 0.25em; margin-top: 16px; color: #FFFFFF;">
          ORION-9
        </div>
        <div style="font-size: 10px; color: #00F2FE; letter-spacing: 0.2em; margin-top: 6px;">
          AI SUPPLY CHAIN OPERATING SYSTEM
        </div>
        <div class="os-pre-bar"></div>
        <div style="font-size: 10px; color: #777873; letter-spacing: 0.15em; margin-top: 12px;">
          INITIALIZING SYSTEM...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
