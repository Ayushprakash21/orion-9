[package]
name = "orion-desktop"
version = "9.0.0"
description = "Orion-9 Operating System Desktop Shell"
authors = ["Orion-9 Core Team"]
edition = "2021"

[lib]
name = "orion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
