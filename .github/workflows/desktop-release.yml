name: Orion-9 Desktop Multi-Platform Release (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - windows
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # WINDOWS BUILD JOB: NSIS (.exe) and WiX (.msi)
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop (NSIS & MSI)
    if: inputs.target_platform == 'all' || inputs.target_platform == 'windows'
    runs-on: windows-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust Stable Toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile Frontend Production Distribution
        run: npm run build

      - name: Build Tauri Desktop (NSIS & MSI)
        run: npx tauri build --bundles nsis,msi
        env:
          CI: true

      - name: Compute Checksums & Verify Artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.exe", "*.msi"
          $lines = @()
          foreach ($file in $artifacts) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($file.Name)"
            Write-Host "VERIFIED: $($file.Name) - Size: $($file.Length) bytes - SHA256: $hash"
          }
          $lines | Out-File -FilePath "src-tauri/target/release/bundle/SHA256SUMS-windows.txt" -Encoding ascii

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orion-9-windows-x64-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # MACOS BUILD JOB: DMG (.dmg) and App Bundle (.app) for Apple Silicon & Universal
  # --------------------------------------------------------------------------
  build-macos:
    name: Build macOS Desktop (Universal & Apple Silicon DMG)
    if: inputs.target_platform == 'all' || inputs.target_platform == 'macos'
    runs-on: macos-14

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust Stable with Universal Darwin Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile Frontend Production Distribution
        run: npm run build

      # Optional Code Signing Preparation (Only executed if secrets are present)
      - name: Prepare Apple Code Signing Keychain (Optional)
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "Keychain configured successfully for Apple Developer ID signing."

      - name: Build macOS Universal DMG & App Bundle
        run: |
          npx tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          CI: true
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Compute Checksums & Verify macOS Artifacts
        run: |
          mkdir -p macos-artifacts
          find src-tauri/target/universal-apple-darwin/release/bundle -type f \( -name "*.dmg" -o -name "*.tar.gz" \) -exec cp {} macos-artifacts/ \;
          cd macos-artifacts
          shasum -a 256 * > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orion-9-macos-universal-dmg
          path: macos-artifacts/*
          if-no-files-found: error
          retention-days: 14
